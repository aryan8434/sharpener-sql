<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expenses</title>
</head>
<body>
    <h1>Add Expense</h1>
    <form id="expenseForm">
        <label>Name <input name="name" required></label>
        <label>Amount <input name="amount" type="number" min="0.01" step="0.01" required></label>
        <button>Add expense</button>
    </form>
    <h2>Expenses</h2>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Amount</th><th>Action</th></tr></thead>
        <tbody id="expenses"></tbody>
    </table>
    <script>
        const api = "http://localhost:3000/expenses", form = document.getElementById("expenseForm"), tbody = document.getElementById("expenses");

        async function request(url, options) {
            const res = await fetch(url, options), data = await res.json();
            if (!res.ok) throw new Error(data.error || "Request failed");
            return data;
        }

        async function loadExpenses() {
            try {
                const expenses = await request(api);
                tbody.replaceChildren(...expenses.map(({ id, name, amount }) => {
                    const row = document.createElement("tr");
                    [id, name, amount].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });
                    const cell = document.createElement("td"), button = document.createElement("button");
                    button.textContent = "Delete";
                    button.onclick = () => deleteExpense(id);
                    cell.appendChild(button);
                    row.appendChild(cell);
                    return row;
                }));
            } catch (err) { console.log(err); }
        }

        async function deleteExpense(id) {
            try {
                await request(`${api}/${encodeURIComponent(id)}`, { method: "DELETE" });
                await loadExpenses();
            } catch (err) { console.log(err); alert(err.message); }
        }

        form.onsubmit = async event => {
            event.preventDefault();
            try {
                const data = new FormData(form);
                await request(api, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: data.get("name").trim(), amount: Number(data.get("amount")) })
                });
                form.reset();
                await loadExpenses();
            } catch (err) { console.log(err); alert(err.message); }
        };

        loadExpenses();
    </script>
</body>
</html>
